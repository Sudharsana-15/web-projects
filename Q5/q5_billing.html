<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supermarket POS Billing</title>
<style>
  * { box-sizing: border-box; font-family: 'Courier New', monospace; margin: 0; }
  body {
    background: #3a3a3a; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 30px 15px; gap: 30px; flex-wrap: wrap;
  }

  /* Entry panel (looks like a register keypad area) */
  .register {
    background: #1e1e1e; border-radius: 12px; padding: 25px; width: 320px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5); font-family: 'Segoe UI', Arial, sans-serif;
  }
  .register h2 { color: #f2c94c; font-size: 16px; text-align: center; margin-bottom: 20px; letter-spacing: 1px; }
  .item-entry { background: #2b2b2b; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .item-entry label { display: block; color: #aaa; font-size: 11px; margin-bottom: 8px; letter-spacing: 1px; }
  .item-entry .fields { display: flex; gap: 8px; }
  .item-entry input {
    width: 100%; padding: 9px; border: none; border-radius: 5px; background: #444; color: #fff; font-size: 13px;
  }
  .item-entry input::placeholder { color: #999; }
  .item-entry input:focus { outline: 2px solid #f2c94c; }

  .ring-btn {
    width: 100%; padding: 14px; background: #f2c94c; color: #1e1e1e; border: none;
    border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; letter-spacing: 1px; margin-top: 5px;
  }
  .ring-btn:hover { background: #ffdd75; }

  /* Receipt output */
  .receipt {
    background: #fdfdf5; width: 300px; padding: 25px 20px; display: none;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    background-image: repeating-linear-gradient(white, white 27px, #f0f0e8 28px);
  }
  .receipt-header { text-align: center; border-bottom: 1px dashed #999; padding-bottom: 12px; margin-bottom: 12px; }
  .receipt-header h3 { font-size: 16px; letter-spacing: 2px; }
  .receipt-header p { font-size: 10px; color: #777; margin-top: 4px; }
  .r-line { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
  .r-divider { border-top: 1px dashed #999; margin: 12px 0; }
  .r-total { font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; }
  .r-discount { color: #c0392b; font-size: 12px; }
  .barcode { text-align: center; margin-top: 18px; font-size: 30px; letter-spacing: -2px; color: #222; }
  .thanks { text-align: center; font-size: 11px; margin-top: 10px; color: #555; }
</style>
</head>
<body>

<div class="register">
  <h2>🛒 SUPERMARKET POS TERMINAL</h2>

  <div class="item-entry">
    <label>ITEM 1</label>
    <div class="fields">
      <input type="number" id="qty1" placeholder="Qty">
      <input type="number" id="price1" placeholder="Price ₹">
    </div>
  </div>
  <div class="item-entry">
    <label>ITEM 2</label>
    <div class="fields">
      <input type="number" id="qty2" placeholder="Qty">
      <input type="number" id="price2" placeholder="Price ₹">
    </div>
  </div>
  <div class="item-entry">
    <label>ITEM 3</label>
    <div class="fields">
      <input type="number" id="qty3" placeholder="Qty">
      <input type="number" id="price3" placeholder="Price ₹">
    </div>
  </div>

  <button class="ring-btn" onclick="calculateBill()">RING UP BILL 🔔</button>
</div>

<div class="receipt" id="result"></div>

<script src="q5_script.js"></script>
</body>
</html>
